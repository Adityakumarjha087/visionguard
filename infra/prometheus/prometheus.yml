global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: visionguard-inference
    static_configs: [{ targets: ["inference:8000"] }]
  - job_name: visionguard-api
    static_configs: [{ targets: ["api:8080"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
